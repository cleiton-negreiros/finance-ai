name: Build 99Pay Extractor

on:
  push:
    branches: [main]
    paths:
      - '99pay-extractor/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: cd 99pay-extractor && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 99pay-extractor-debug
          path: 99pay-extractor/app/build/outputs/apk/debug/app-debug.apk
